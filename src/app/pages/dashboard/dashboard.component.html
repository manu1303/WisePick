<div class="layout" [class.collapsed]="isSidebarCollapsed">
  <!-- Sidebar -->
  <aside class="sidebar">
    <a class="brand" routerLink="/">
      <img class="brand-logo" src="/assets/wisepicklogo.svg" alt="WisePick" />
    </a>

    <p class="section-title">Navegación principal</p>
    <nav class="menu">
      <a class="item" routerLink="/dashboard/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <img class="ico" src="/assets/homepickicon.svg" alt="" />
        <span>Inicio</span>
      </a>
      <a class="item" routerLink="/dashboard/company" routerLinkActive="active">
        <img class="ico" src="/assets/folderpick.svg" alt="" />
        <span>Mi Empresa</span>
      </a>
      <a class="item" routerLink="/dashboard/sales" routerLinkActive="active">
        <img class="ico" src="/assets/chartpick.svg" alt="" />
        <span>Ventas</span>
      </a>
      <a class="item" routerLink="/dashboard/products" routerLinkActive="active">
        <img class="ico" src="/assets/lockerpick.svg" alt="" />
        <span>Productos</span>
      </a>
      <a class="item" routerLink="/dashboard/clients" routerLinkActive="active">
        <img class="ico" src="/assets/clienticon.svg" alt="" />
        <span>Clientes</span>
      </a>
      <a class="item" routerLink="/dashboard/dash" routerLinkActive="active">
        <img class="ico" src="/assets/dashboardpick.svg" alt="" />
        <span>Dashboard</span>
      </a>
        <a class="item" routerLink="/dashboard/marketing-ia"routerLinkActive="active">
        <img class="ico" src="/assets/roboticon.svg" alt="" />
        <span>Marketing IA</span>
      </a>
        <a class="item" routerLink="/dashboard/campaigns"routerLinkActive="active">
        <img class="ico" src="/assets/campaignpickicon.svg" alt="" />
        <span>Campañas</span>
      </a>
      
      
    </nav>

    <p class="section-title">Gestión</p>
    <nav class="menu">
      <a class="item" routerLink="/dashboard/reports" routerLinkActive="active">
        <img class="ico" src="/assets/docpick.svg" alt="" />
        <span>Reportes</span>
      </a>
    </nav>

    <p class="section-title">Configuración</p>
    <nav class="menu">
      <a class="item" routerLink="/dashboard/settings" routerLinkActive="active">
        <img class="ico" src="/assets/helppick.svg" alt="" />
        <span>Configuración</span>
      </a>
    </nav>

    <div class="user">
      <div class="avatar">JP</div>
      <div class="info">
        <b>Pao JP</b>
        <small>paojp@mail.com</small>
      </div>
    </div>
  </aside>

  <!-- Topbar -->
 <header class="topbar">
  <!-- LADO IZQUIERDO: toggle de sidebar -->
  <div class="left">
    <button class="icon-btn" type="button" (click)="toggleSidebar()" aria-label="Ocultar/mostrar menú">
      <img src="/assets/panelpick.svg" alt="" />
    </button>
  </div>

  <!-- CENTRO: buscador al 50% -->
  <div class="center">
    <input class="search" type="text" placeholder="🔍 Search" />
  </div>

  <!-- DERECHA: acciones -->
  <div class="right">
    <button class="btn primary" type="button">+ Nuevo Proyecto</button>
    <button class="icon-btn" type="button" aria-label="Notificaciones">
      <img src="/assets/ringpick.svg" alt="" />
    </button>
    <button class="icon-btn" type="button" aria-label="Usuario">
      <img class="avatar-ico" src="/assets/userpick.svg" alt="" />
    </button>
  </div>
</header>

  <!-- Área de trabajo -->
  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
